[project]
name = "django-smallstack"
version = "0.26.0"
description = "A minimal Django stack for building and deploying admin-style apps"
requires-python = ">=3.12"
dependencies = [
    # 6.1.2 is a security release (2026-10-06): CVE-2026-77050 and
    # CVE-2026-84429 are both denial-of-service and apply to any Django site
    # (Accept-Language parsing, HTTP header parsing). Floor raised past them so
    # a downstream resolve can't land on a vulnerable version.
    "django>=6.1.2",
    "python-decouple>=3.8",
    "pillow>=10.0",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
    "django-extensions>=3.2",
    "markdown>=3.5",
    "pyyaml>=6.0",
    # Pinned to one minor. apps/tasks shadows this package's db_worker command,
    # subclasses it, and imports its DatabaseBackend and DBTaskResult — so a
    # minor bump can stop the reliability layer importing at all, which is
    # exactly what 0.12 -> 0.13 did when it removed its bundled django_tasks.
    # A floor alone could not have caught that; the ceiling is the point.
    "django-tasks-db>=0.13,<0.14",
    "django-htmx>=1.19",
    "django-axes>=7.0",
    "django-csp>=4.0",
    "tablib>=3.9.0",
    "django-filter>=25.2",
    "django-cors-headers>=4.9.0",
    "croniter>=6.2.4",
    "tzdata>=2025.3",
]

[project.scripts]
# `rb` — shorthand for `manage.py runbook` (finds manage.py by walking up, keeps stdin piping).
rb = "apps.runbook.shim:main"
# `sc` — SmallStack framework CLI: `manage.py sc <verb>` over the CRUDView registry + ops verbs.
sc = "apps.smallstack.shim:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "openapi-spec-validator>=0.7",
    "mypy>=1.11",
    "django-stubs>=5.1",
]
# PostgreSQL driver — install with `uv sync --extra postgres` (or --all-extras)
# when running SmallStack on Postgres. SQLite (the default) needs nothing here.
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]  # Migrations are auto-generated

[tool.mypy]
# Lenient by design: locks in type-clean apps and stops drift there. Bodies of
# untyped functions aren't checked (check_untyped_defs=false), so this catches
# signature/attribute/annotation errors without demanding full annotation.
# Run with `make typecheck`. No CI lane — CI is intentionally absent upstream;
# this is a local / pre-commit guard. Widen `files` as more apps go green.
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
# Silence the per-file "note: ...untyped functions are not checked" chatter that
# check_untyped_defs=false emits — it's informational, not a finding, and would
# spam the pre-commit hook output.
disable_error_code = ["annotation-unchecked"]
warn_redundant_casts = true
warn_unused_ignores = false
exclude = '(/migrations/|/tests/|test_[^/]*\.py$)'
# Type-clean under mypy + django-stubs: every app is covered. Migrations and
# tests are excluded (see `exclude`). New apps should be added here and kept
# green.
files = ["apps"]

# ── The typing ratchet ───────────────────────────────────────────────────────
# The global block above is lenient so legacy debt (apps/smallstack, explorer,
# usermanager…) doesn't flood the gate. The apps listed here are already fully
# annotated, so for them the convention in CLAUDE.md ("annotate every
# signature") is enforced by mypy, not by review: an unannotated function or
# an unchecked body fails `make lint`. Add an app here the moment it reaches
# zero under `make typecheck-strict`; never remove one.
[[tool.mypy.overrides]]
module = [
    "apps.activity.*",
    "apps.approvals.*",
    "apps.blog.*",
    "apps.datasets.*",
    "apps.feeds.*",
    "apps.notifications.*",
    "apps.runbook.*",
    "apps.scheduler.*",
    "apps.webhooks.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]
addopts = "--ds=config.settings.test --cov=apps --cov-report=term-missing:skip-covered --cov-report=html"
filterwarnings = [
    "ignore:SMALLSTACK_TOPBAR_NAV_ITEMS:DeprecationWarning",
    # Media (.md) files served by whitenoise / read by Django's FileField during
    # runbook tests are closed by GC, not explicitly — a harmless test-env
    # artifact, not a production leak. Scoped to the unclosed-file message so a
    # genuine future leak still surfaces.
    "ignore:unclosed file:ResourceWarning",
]
markers = [
    "starter_content: tests that assert upstream starter *copy/pages* (legal text, marketing/home, signup) a downstream replaces or disables — safe to skip downstream. Do NOT tag framework chrome (breadcrumbs, topbar nav) that downstream keeps.",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.uv]
package = true

