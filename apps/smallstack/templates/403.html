{% load static %}
<!DOCTYPE html>
<html lang="en">

    <title>403 Forbidden</title>
    <script src="{% static 'smallstack/js/theme-init.js' %}"></script>
    <link rel="stylesheet" href="{% static 'smallstack/css/templates/errors.css' %}">

<body>
