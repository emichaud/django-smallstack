{% load static %}
<!-- Bulk Actions Bar — single-line, paginator-style -->
<div id="bulk-actions-bar" class="bulk-actions-bar">
    <nav class="bulk-nav">
        <span class="bulk-nav-current"><span id="bulk-count-num">0</span><span class="bulk-nav-of">selected</span></span>
        {% if "delete" in bulk_actions %}
        <button type="button" class="bulk-nav-btn bulk-nav-delete" data-ss-action="bulkDeletePrompt">Delete</button>
        {% endif %}
        {% if "update" in bulk_actions %}
        <button type="button" class="bulk-nav-btn" data-ss-action="bulkUpdatePrompt">Update</button>
        {% endif %}
        <button type="button" class="bulk-nav-btn" data-ss-action="bulkClearAll">Clear</button>
    </nav>
</div>

<script src="{% static 'smallstack/js/templates/crud/includes/bulk_actions_bar.js' %}"></script>
