title: "Dashboards"
description: "Metrics (saved filters over datasets), grid dashboards and KPI reports — built by hand or by an AI agent"
slug: dashboards

# "In short" pages are the ones a page's help bubble opens ({% help_bubble %}):
# one idea each, about a page long. The guides go further.
categories:
  - "In short"
  - "Guides"

pages:
  - slug: how-it-fits
    title: "How it all fits together"
