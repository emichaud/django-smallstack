    category: "In short"
  - slug: component
    title: "What is a component?"
    description: "A saved card: a dataset filtered for it, or a metric for a single number, drawn by one design, built once and placed on any number of dashboards"
    icon: "dashboard"
    category: "In short"
  - slug: dashboard
    title: "What is a dashboard?"
    description: "A grid of cards over your metrics: reading one, building one, and who can see it"
    icon: "dashboard"
    category: "In short"
  - slug: goal-list
    title: "What is a goal list?"
    description: "Key numbers against their targets, read down in a meeting: on target, at risk or missed"
