    category: "In short"
  - slug: dataset
    title: "What is a dataset?"
    description: "A named, filterable table of data: the layer between a data source and everything built on it"
    icon: "code"
    category: "In short"
  - slug: metric
    title: "What is a metric?"
    description: "A saved filter over a dataset, rolled up to one number: the reusable unit behind every card, goal and report row"
